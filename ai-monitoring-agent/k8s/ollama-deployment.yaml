# Dedicated Ollama deployment so LLM inference gets its own CPU and is not
# starved by the monitoring app. Models live on a PVC so they survive restarts
# (no more re-pulling qwen2.5:1.5b every time the pod cycles).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: jupiter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: managed-csi   # uncomment/set if the cluster has no default StorageClass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: jupiter
  labels:
    app: ollama
spec:
  replicas: 0
  strategy:
    type: Recreate          # RWO volume: never run two pods mounting it at once
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST          # listen on all interfaces so the app pod can reach it
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE    # keep the model resident between calls
              value: "30m"
            - name: OLLAMA_NUM_PARALLEL  # 1 request at a time = full CPU per request (best CPU latency)
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          resources:
            requests:
              cpu: "3"
              memory: "5Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          lifecycle:
            postStart:
              exec:
                # Pull both models on first start; no-op once they're on the PVC.
                # 1.5b is fast on CPU; 7b-instruct gives better fix quality.
                command: ["/bin/sh", "-c", "sleep 5; ollama pull qwen2.5:1.5b || true; ollama pull qwen2.5:7b-instruct-q4_K_M || true"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: jupiter
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP
