apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-monitoring-agent
  namespace: mercury
  labels:
    app: ai-monitoring-agent
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ai-monitoring-agent
  template:
    metadata:
      labels:
        app: ai-monitoring-agent
    spec:
      serviceAccountName: ai-monitoring-agent
      securityContext:
        fsGroup: 10001
      containers:
      - name: ai-monitoring-agent
        image: 266970247417.dkr.ecr.ap-south-1.amazonaws.com/fabhotels-development/fabhotels-registry/ai-monitoring-agent:203
        ports:
        - containerPort: 5000
        - containerPort: 11434
        env:
        - name: FLASK_ENV
          value: "production"
        - name: OLLAMA_MODELS
          value: "/app/models"
        - name: OLLAMA_MODEL
          value: "phi3:mini"
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-monitoring-agent-secrets
              key: GITHUB_TOKEN
              optional: true
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-monitoring-agent-secrets
              key: GITHUB_TOKEN
              optional: true
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.json
          subPath: config.json
        - name: models-volume
          mountPath: /app/models
        - name: otel-shared-volume
          mountPath: /var/otel
        resources:
          requests:
            memory: "4Gi"
            cpu: "1700m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "7Gi"
            cpu: "2500m"
            ephemeral-storage: "5Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      - name: otel-collector-sidecar
        image: otel/opentelemetry-collector-contrib:0.100.0
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
        command:
          - /otelcol-contrib
        args:
          - "--config=/conf/otel-collector-config.yaml"
        ports:
        - containerPort: 4317
        - containerPort: 4318
        volumeMounts:
        - name: otel-collector-config
          mountPath: /conf
        - name: otel-shared-volume
          mountPath: /var/otel
      volumes:
      - name: config-volume
        configMap:
          name: ai-monitoring-agent-config
      - name: models-volume
        emptyDir: {}
      - name: otel-collector-config
        configMap:
          name: ai-monitoring-agent-otel-config
      - name: otel-shared-volume
        persistentVolumeClaim:
          claimName: ai-monitoring-agent-otel-pvc-v2
