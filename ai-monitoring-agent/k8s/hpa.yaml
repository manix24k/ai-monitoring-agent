apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-monitoring-agent
  namespace: mercury
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-monitoring-agent
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
