apiVersion: v1
kind: Service
metadata:
  name: ai-monitoring-agent-redis
  namespace: jupiter
  labels:
    app: ai-monitoring-agent-redis
spec:
  selector:
    app: ai-monitoring-agent-redis
  ports:
  - name: redis
    port: 6380
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-monitoring-agent-redis
  namespace: jupiter
  labels:
    app: ai-monitoring-agent-redis
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ai-monitoring-agent-redis
  template:
    metadata:
      labels:
        app: ai-monitoring-agent-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        args:
        - "--save"
        - ""
        - "--appendonly"
        - "no"
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
