apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-monitoring-agent-otel-config
  namespace: mercury
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
        timeout: 2s
        send_batch_size: 1024
      resource:
        attributes:
          - key: deployment.environment
            value: dev
            action: upsert

    exporters:
      file:
        path: /var/otel/traces.json
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [file, debug]
