apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-monitoring-agent-config
  namespace: jupiter
data:
  config.json: |
    {
      "prometheus": {
        "url": "http://fabhotels-dev-kube-prometh-prometheus.monitoring.svc.cluster.local:9090",
        "metrics": {
          "request_rate_query": "sum(rate(http_requests_total[5m])) by (job)",
          "error_rate_query": "sum(rate(http_requests_total{code=~\"5..\"}[5m])) by (job)",
          "latency_query": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))"
        }
      },
      "elasticsearch": {
        "hosts": ["http://10.0.0.6:9200"],
        "username": "elastic",
        "password": "",
        "index_prefix": "*-*,-.*",
        "log_window_minutes": 720,
        "log_limit": 500,
        "trace_limit": 25
      },
      "monitoring": {
        "sampling_rate": 0.5,
        "use_static_monitored_services": false,
        "service_selection_source": "cluster",
        "include_k8s_service_objects": false,
        "incident_log_window_minutes": 15,
        "use_kubectl": false,
        "use_kubectl_pod_health": true,
        "pod_health_workers": 6,
        "use_sidecar_otel_traces": true,
        "background_snapshot_enabled": true,
        "background_snapshot_interval_seconds": 30,
        "background_snapshot_window_minutes": 30,
        "otel_trace_file_path": "/var/otel/traces.json",
        "enable_otel_trace_retention": true,
        "otel_trace_retention_days": 2,
        "otel_trace_archive_dir": "/var/otel/archive",
        "otel_trace_rotate_seconds": 3600,
        "otel_trace_rotate_mb": 512,
        "otel_trace_retention_check_seconds": 300,
        "otel_trace_max_records_per_cycle": 500,
        "trace_latency_threshold_ms": 1500,
        "incident_retention_hours": 24,
        "enable_deep_inspection": true,
        "kubectl_timeout_seconds": 25,
        "pods_cache_seconds": 45,
        "pods_backoff_seconds": 60,
        "discovery_cache_seconds": 90,
        "deep_inspection_service_limit": 40,
        "log_probe_retries": 3,
        "log_probe_wait_seconds": 1.2,
        "troubleshoot_log_probe_retries": 5,
        "troubleshoot_log_probe_wait_seconds": 2.0,
        "troubleshoot_log_tail_lines": 2000,
        "troubleshoot_log_since_minutes": 120,
        "troubleshoot_full_scan_enabled": true,
        "troubleshoot_full_scan_since_minutes": 5,
        "troubleshoot_full_scan_timeout_seconds": 45,
        "discovery_namespaces": ["jupiter", "venus"],
        "auto_select_per_namespace": 20,
        "auto_select_total_limit": 40,
        "auto_select_cache_seconds": 120,
        "auto_select_stale_fallback_seconds": 900,
        "service_status_window_cap_minutes": 60,
        "service_status_window_cap_threshold": 100,
        "full_status_cache_seconds": 90,
        "strict_recent_error_max_services": 120,
        "redis_cache": {
          "enabled": false,
          "url": "redis://redis:6379/0",
          "ttl_seconds": 120,
          "connect_timeout_seconds": 1.0,
          "socket_timeout_seconds": 1.5
        },
        "rate_limit": {
          "prometheus_queries_per_minute": 30,
          "check_interval": 60
        }
      },
      "anomaly_detection": {
        "contamination": 0.1,
        "window_size": 120,
        "check_interval": 60
      },
      "learning": {
        "model_dir": "./models",
        "feedback_threshold": 50,
        "history_limit": 500,
        "adaptive_threshold_window": 100
      },
      "llm": {
        "api_url": "http://20.244.11.93/v1",
        "api_key": "",
        "model": "qwen3",
        "timeout": 20
      },
      "pr_automation": {
        "enabled": true,
        "auto_create_pr": false,
        "repo_base_url": "https://github.com/fabhotelstech",
        "target_branch": "develop_venus",
        "fix_mode": "source_fix",
        "eligibility_mode": "permissive",
        "allow_analysis_report_pr": false,
        "default_base_branch": "develop_venus",
        "manifest_path_hints": [
          "{namespace}/java17/{service}/deployment.yaml",
          "{namespace}/java8/{service}/deployment.yaml",
          "{namespace}/python/{service}/deployment.yaml"
        ],
        "k8s_manifest_repo": {
          "repo_name": "k8s-manifest",
          "repo_base_url": "https://github.com/fabhotelstech",
          "target_branch": "develop_venus",
          "environment_roots": {
            "jupiter": ["jupiter/java17", "jupiter/java8", "jupiter/python", "jupiter"],
            "venus": ["venus/java17", "venus/java8", "venus/python", "venus"]
          }
        },
        "ignore_issue_patterns": [
          "(?i)insertpropertypendingcheckouttaskjob\\s*-->",
          "(?i)insertpropertypendingcheckintaskjob\\s*-->",
          "(?i)quartzscheduler_.*misfirehandler",
          "(?i)localdatasourcejobstore.*misfirehandler.*couldn't retrieve trigger",
          "(?i)org\\.quartz\\.jobpersistenceexception"
        ],
        "repo_overrides": {
          "catalog": {
            "repo": "catalog-service",
            "branch": "develop_venus"
          },
          "catalog-service": {
            "repo": "catalog-service",
            "branch": "develop_venus"
          },
          "fabbooking": {
            "repo": "booking-service",
            "branch": "develop_venus"
          },
          "booking-service": {
            "repo": "booking-service",
            "branch": "develop_venus"
          },
          "aerospike": {
            "repo": "aerospike-service",
            "branch": "develop_venus"
          },
          "bus-booking-search-service": {
            "repo": "bus-booking-search-service",
            "branch": "develop_venus"
          },
          "bus-booking-search": {
            "repo": "bus-booking-search-service",
            "branch": "develop_venus"
          },
          "flight-booking": {
            "repo": "flight-booking-service",
            "branch": "develop_venus"
          },
          "flight-preprocessor": {
            "repo": "flight-preprocessor-service",
            "branch": "develop_venus"
          },
          "b2b-aggregation": {
            "repo": "b2b-aggregation",
            "branch": "develop_venus"
          },
          "conference-booking": {
            "repo": "conference-booking-service",
            "branch": "develop_venus"
          },
          "conference-invoice": {
            "repo": "conference-invoice-service",
            "branch": "develop_venus"
          },
          "budgetmanagement": {
            "repo": "conference-booking-service",
            "branch": "develop_venus"
          },
          "cab-booking": {
            "repo": "cab-booking-service",
            "branch": "develop_venus"
          },
          "cab-booking-service": {
            "repo": "cab-booking-service",
            "branch": "develop_venus"
          },
          "_shared_repos_": [
            {"repo": "java-utils", "branch": "develop_venus"}
          ]
        }
      },
      "slack": {
        "webhook_url": "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK",
        "channel": "#alerts",
        "enable_feedback": true,
        "alert_delay_minutes": 5
      },
      "max_selected_services": 20,
      "all_services_discovery_limit": 50,
      "monitored_services": [],
        "ignored_log_patterns": [
          "(?i)io\\.opentelemetry\\.exporter\\.internal\\.http\\.HttpExporter\\s*-\\s*Failed to export spans",
          "(?i)otel\\.javaagent.*failed to export spans",
          "(?i)otel\\.javaagent.*okhttp.*fabhotels-signoz-prod-otel-collector\\.signoz-prod11\\.svc",
          "(?i)fabhotels-signoz-prod-otel-collector\\.signoz-prod11\\.svc",
          "(?i)fabhotels-signoz-prod-otel-collector.*\\.svc\\.cluster\\.local(?::4318)?",
          "(?i)org\\.apache\\.catalina\\.valves\\.ErrorReportValve\\.invoke\\(ErrorReportValve\\.java:92\\)",
          "(?i)insertpropertypendingcheckouttaskjob\\s*-->",
          "(?i)insertpropertypendingcheckintaskjob\\s*-->",
          "(?i)quartzscheduler_.*misfirehandler",
          "(?i)localdatasourcejobstore.*misfirehandler.*couldn't retrieve trigger",
          "(?i)org\\.quartz\\.jobpersistenceexception",
          "(?i)springcontextshutdownhook",
          "(?i)tracehookregisteringbeandefinitionregistrypostprocessor",
          "(?i)destroy method 'close'.*nosuchmethoderror"
        ],
      "services": [
        {
          "name": "b2b-aggregation",
          "priority": "high",
          "sampling": 1.0
        },
        {
          "name": "flight-booking",
          "priority": "high",
          "sampling": 1.0
        },
        {
          "name": "flight-preprocessor",
          "priority": "high",
          "sampling": 1.0
        },
        {
          "name": "bus-booking-search",
          "priority": "high",
          "sampling": 1.0
        },
        {
          "name": "cab-booking",
          "priority": "high",
          "sampling": 1.0
        }
      ],
      "codexa": {
        "enabled": true,
        "auto_detect": true,
        "auto_analyze": false,
        "auto_fix": false,
        "poll_interval_seconds": 60,
        "llm": {
          "provider": "anthropic",
          "model": "claude-sonnet-4-6",
          "host": "http://127.0.0.1:11434",
          "timeout": 120,
          "max_tokens": 4096,
          "temperature": 0.1
        },
        "github": {
          "org": "fabhotelstech",
          "default_branch": "develop_venus",
          "pr_labels": ["ai-generated", "codexa-fix"]
        },
        "analysis": {
          "max_files_per_issue": 10,
          "max_context_lines": 100,
          "verification_timeout": 120,
          "workspace": "/var/otel/codexa-workspace"
        },
        "issue_types": [
          "NullPointerException",
          "SQLException",
          "IllegalArgumentException",
          "IndexOutOfBoundsException",
          "ConfigurationException",
          "ValidationException"
        ],
        "repo_mappings": {
          "b2b-aggregation": "b2b-aggregation",
          "jupiter/b2b-aggregation": "b2b-aggregation"
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-monitoring-agent-otel-config
  namespace: jupiter
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
        timeout: 2s
        send_batch_size: 1024
      resource:
        attributes:
          - key: deployment.environment
            value: dev
            action: upsert

    exporters:
      file:
        path: /var/otel/traces.json
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [file, debug]
