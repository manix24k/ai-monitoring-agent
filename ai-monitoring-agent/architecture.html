<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI SRE Agent — Live Architecture</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07111e;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif}

/* ── HEADER ── */
#hdr{display:flex;align-items:center;gap:10px;padding:0 20px;background:#060e1a;border-bottom:1px solid #0d2040;height:44px;flex-shrink:0}
#hdr h1{font-size:14px;font-weight:700;color:#58a6ff;white-space:nowrap}
.badge{font-size:10px;padding:2px 10px;border-radius:20px;font-weight:600;border:1px solid}
.bj{color:#58a6ff;border-color:#1f6feb66;background:#1f6feb15}
.bv{color:#bc8cff;border-color:#8957e566;background:#8957e515}
.divider{width:1px;height:20px;background:#0d2040;margin:0 4px}
.legend{display:flex;gap:14px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#3d5a7a;white-space:nowrap}
.ldot{width:9px;height:4px;border-radius:2px}
.stats{margin-left:auto;display:flex;gap:18px}
.stat{font-size:11px;color:#3d5a7a}.stat b{color:#c9d1d9}

/* ── BODY ── */
#body{display:flex;height:calc(100vh - 44px)}
#dw{flex:1;min-width:0;overflow:hidden;position:relative}
#dw svg{width:100%;height:100%;display:block}

/* ── ALWAYS-RUNNING LINE ANIMATION (CSS only, never stops) ── */
@keyframes fl{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}

/* base connection: invisible background for fat hit area */
.cb{fill:none;stroke:transparent;stroke-width:12}

/* animated flow line */
.cf{fill:none;stroke-width:2.5;stroke-dasharray:10 7;stroke-linecap:round}

/* glow layer */
.cg{fill:none;stroke-width:7;stroke-opacity:.12}

/* tier labels */
.tlbl{font:700 9px 'Segoe UI',sans-serif;fill:#0d2040;letter-spacing:2px;text-transform:uppercase}

/* node */
.nb{rx:10;fill:#060e1a;stroke-width:1.5}
.nt{font:700 11.5px 'Segoe UI',sans-serif;fill:#c9d1d9;text-anchor:middle}
.ns{font:9.5px 'Segoe UI',sans-serif;fill:#3d5a7a;text-anchor:middle}

/* ── RIGHT PANEL ── */
#panel{width:280px;flex-shrink:0;display:flex;flex-direction:column;background:#050c16;border-left:1px solid #0d2040}
#ph{padding:8px 14px;border-bottom:1px solid #0d2040;font-size:9px;font-weight:700;letter-spacing:2px;color:#0d2040;text-transform:uppercase;display:flex;align-items:center;gap:7px}
#blink{width:6px;height:6px;border-radius:50%;background:#3fb950}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
#log-list{flex:1;overflow-y:auto;padding:3px 0}
#log-list::-webkit-scrollbar{width:2px}
#log-list::-webkit-scrollbar-thumb{background:#0d2040}
.le{padding:5px 12px;border-bottom:1px solid #070f1c;font-size:10px;line-height:1.55;animation:ein .25s ease}
@keyframes ein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.lt{color:#0d2040;font-family:monospace;font-size:9px;margin-right:4px}
.lc{font-size:11px;margin-right:3px}
.lm{color:#5a7a9a}

/* pipeline status strips */
#pipes{padding:10px 12px;border-top:1px solid #0d2040;display:flex;flex-direction:column;gap:4px}
#pttl{font-size:9px;font-weight:700;letter-spacing:2px;color:#0d2040;text-transform:uppercase;margin-bottom:4px}
.prow{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;background:#060e1a;border:1px solid #0d2040}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:bk .9s ease-in-out infinite}
.pname{font-size:10.5px;font-weight:600;flex:1}
.pstep{font-size:9.5px;opacity:.6;white-space:nowrap}
</style>
</head>
<body>

<div id="hdr">
  <h1>⚡ AI SRE Agent</h1>
  <span class="badge bj">jupiter</span>
  <span class="badge bv">venus</span>
  <div class="divider"></div>
  <div class="legend">
    <div class="leg"><div class="ldot" style="background:#f97316"></div>Log Ingest</div>
    <div class="leg"><div class="ldot" style="background:#3fb950"></div>CodeXA Fix</div>
    <div class="leg"><div class="ldot" style="background:#58a6ff"></div>RCA Engine</div>
    <div class="leg"><div class="ldot" style="background:#bc8cff"></div>k8s Agent</div>
    <div class="leg"><div class="ldot" style="background:#e3b341"></div>CI/CD Deploy</div>
  </div>
  <div class="stats">
    <div class="stat">Incidents <b id="s0">0</b></div>
    <div class="stat">PRs <b id="s1">0</b></div>
    <div class="stat">Fixed <b id="s2">0</b></div>
  </div>
</div>

<div id="body">
<div id="dw">
<svg id="svg" viewBox="0 0 1040 575" preserveAspectRatio="xMidYMid meet">
<defs>
  <!-- Color-inheriting arrowhead: uses context-stroke so it matches the line color -->
  <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,5 L7,2.5 z" fill="context-stroke"/>
  </marker>
  <!-- glow filters per color -->
  <filter id="gO"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gG"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gB"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gP"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gY"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gC"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gR"><feGaussianBlur stdDeviation="4"/></filter>
  <!-- node glow -->
  <filter id="ng" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feFlood flood-color="var(--nc,#58a6ff)" flood-opacity=".6" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- tier labels -->
<text x="12" y="50"  class="tlbl">DATA IN</text>
<text x="12" y="162" class="tlbl">DETECT</text>
<text x="12" y="278" class="tlbl">ANALYSE</text>
<text x="12" y="393" class="tlbl">OUTPUT</text>
<text x="12" y="500" class="tlbl">DEPLOY</text>

<!-- ═══ CONNECTIONS — drawn first, behind nodes ═══ -->
<g id="conn-layer"></g>
<!-- ═══ NODES ═══ -->
<g id="node-layer"></g>
</svg>
</div>

<div id="panel">
  <div id="ph"><div id="blink" style="animation:bk 1s ease-in-out infinite"></div>LIVE EVENT STREAM</div>
  <div id="log-list"></div>
  <div id="pipes">
    <div id="pttl">RUNNING PIPELINES</div>
    <!-- built by JS -->
  </div>
</div>
</div>

<script>
const SVG_NS='http://www.w3.org/2000/svg';
const NW=140, NH=46;

// ── NODE POSITIONS ──
const N={
  es:     {x:48, y:15, t:'Elasticsearch',  s:'Logs & Stack Traces',  c:'#f97316'},
  prom:   {x:438,y:15, t:'Prometheus',     s:'Metrics & Alerts',     c:'#e11d48'},
  k8sapi: {x:828,y:15, t:'K8s API',        s:'Pods & Deployments',  c:'#8b5cf6'},
  core:   {x:228,y:128,t:'Core Agent',     s:'main.py · Anomaly',   c:'#2563eb'},
  k8sa:   {x:588,y:128,t:'k8s_agent',      s:'Pod Diagnosis+YAML',  c:'#7c3aed'},
  rollout:{x:858,y:128,t:'Rollout Monitor',s:'Deployment Watch',    c:'#0891b2'},
  rca:    {x:48, y:244,t:'RCA Engine',     s:'L0 / L1 / L2',        c:'#2563eb'},
  codexa: {x:238,y:244,t:'CodeXA Engine',  s:'detect→analyze→fix',  c:'#3fb950'},
  ollama: {x:448,y:244,t:'Ollama LLM',     s:'qwen2.5:1.5b / 7b',   c:'#d97706'},
  redis:  {x:658,y:244,t:'Redis / Learn',  s:'L0/L1 Pattern Cache', c:'#dc2626'},
  infrafix:{x:858,y:244,t:'InfraFix',      s:'Manifest Audit',      c:'#0891b2'},
  github: {x:108,y:359,t:'GitHub PR',      s:'Code Fix · fabhotels',c:'#6e7681'},
  slack:  {x:368,y:359,t:'Slack',          s:'#codexa-alerts',      c:'#7c3aed'},
  k8smf:  {x:658,y:359,t:'k8s-manifest',   s:'YAML Fix PR',         c:'#6e7681'},
  jenkins:{x:308,y:465,t:'Jenkins',        s:'AI-AGENT-BOT',        c:'#b45309'},
  argocd: {x:588,y:465,t:'ArgoCD',         s:'GitOps Deploy · sync',c:'#0369a1'},
};

// ── CONNECTIONS  [from, to, color, animDuration(s), delay(s)] ──
// Color = what type of data this carries
const CONNS=[
  // DATA IN → DETECTION
  ['es',    'core',    '#f97316', 2.2, 0.0],
  ['prom',  'core',    '#e11d48', 2.5, 0.4],
  ['k8sapi','core',    '#8b5cf6', 2.8, 0.8],
  ['k8sapi','k8sa',    '#8b5cf6', 2.2, 0.3],
  ['k8sapi','rollout', '#0891b2', 3.0, 1.1],
  // DETECTION → ANALYSIS
  ['core',  'rca',     '#58a6ff', 2.0, 0.2],
  ['core',  'codexa',  '#3fb950', 2.4, 0.6],
  ['core',  'k8sa',    '#7c3aed', 2.8, 1.0],
  ['rollout','core',   '#0891b2', 3.5, 1.4],
  // ANALYSIS internals
  ['rca',   'ollama',  '#58a6ff', 3.5, 0.5],
  ['rca',   'redis',   '#58a6ff', 2.0, 0.0],
  ['redis', 'rca',     '#dc2626', 1.8, 0.9],
  ['ollama','rca',     '#d97706', 3.8, 1.2],
  ['ollama','codexa',  '#3fb950', 3.5, 0.7],
  ['k8sa',  'ollama',  '#7c3aed', 3.0, 0.3],
  ['k8sa',  'infrafix','#0891b2', 2.5, 0.8],
  // ANALYSIS → OUTPUT
  ['codexa','github',  '#3fb950', 2.2, 0.0],
  ['codexa','slack',   '#bc8cff', 2.8, 0.5],
  ['k8sa',  'k8smf',   '#7c3aed', 2.5, 1.0],
  ['infrafix','k8smf', '#0891b2', 2.2, 0.4],
  // OUTPUT → DEPLOY
  ['github','jenkins', '#e3b341', 2.5, 0.0],
  ['k8smf', 'jenkins', '#e3b341', 2.5, 0.7],
  ['jenkins','argocd', '#0369a1', 3.0, 0.3],
];

// ── HELPERS ──
function cx(id){return N[id].x+NW/2}
function cy(id){return N[id].y+NH/2}
function mk(tag,a){
  const e=document.createElementNS(SVG_NS,tag);
  for(const[k,v]of Object.entries(a))e.setAttribute(k,v);
  return e;
}
function bezD(a,b){
  const ax=cx(a),ay=cy(a),bx=cx(b),by=cy(b);
  const dx=bx-ax,dy=by-ay;
  return`M${ax},${ay} C${ax+dx*.25},${ay+dy*.6} ${bx-dx*.25},${by-dy*.6} ${bx},${by}`;
}

// ── BUILD DIAGRAM ──
function build(){
  const cl=document.getElementById('conn-layer');
  const nl=document.getElementById('node-layer');

  // Draw connections
  for(const[a,b,color,dur,delay] of CONNS){
    const d=bezD(a,b);
    // glow background (static, very subtle)
    const glow=mk('path',{d,fill:'none',stroke:color,'stroke-width':'6','stroke-opacity':'.08'});
    cl.appendChild(glow);
    // animated flow line
    const fl=mk('path',{
      d, fill:'none', stroke:color,
      'stroke-width':'2.5',
      'stroke-dasharray':'10 7',
      'stroke-linecap':'round',
      'marker-end':'url(#arr)'
    });
    fl.style.animation=`fl ${dur}s linear ${delay}s infinite`;
    cl.appendChild(fl);
  }

  // Draw nodes (on top)
  for(const[id,n]of Object.entries(N)){
    const g=mk('g',{id:'nd_'+id,transform:`translate(${n.x},${n.y})`});
    const bg=mk('rect',{x:0,y:0,width:NW,height:NH,rx:9,fill:'#060e1a',stroke:n.c+'44','stroke-width':'1.5',class:'nb'});
    const t=mk('text',{x:NW/2,y:17,class:'nt'});t.textContent=n.t;
    const s=mk('text',{x:NW/2,y:31,class:'ns'});s.textContent=n.s;
    const bar=mk('rect',{x:28,y:NH-4,width:NW-56,height:3,rx:2,fill:n.c+'50'});
    g.append(bg,t,s,bar);
    nl.appendChild(g);
  }
}

// ── EVENTS LOG ──
const EVENTS=[
  ['#f97316','📥','Exception logs ingested — NullPointerException in BookingService.java:142'],
  ['#3fb950','🔍','CodeXA: code issue detected → routing to analysis engine'],
  ['#3fb950','🤖','Repo cloned · sending stack trace to qwen2.5:7b for analysis'],
  ['#d97706','💡','Ollama: root cause identified — null bookingId on empty filters'],
  ['#3fb950','✅','PR opened: [CodeXA] b2c-search: fix NPE in BookingService'],
  ['#bc8cff','📢','Slack: consolidated service report sent to #codexa-alerts'],
  ['#8b5cf6','🚨','CrashLoopBackOff detected — pod cab-aggregation-6b9d7f-xkp2q'],
  ['#7c3aed','📋','k8s_agent: collecting pod logs for LLM analysis (semaphore)'],
  ['#d97706','🔧','Diagnosis: OOMKilled — memory limit 256Mi too low → 512Mi'],
  ['#7c3aed','✅','PR opened: [k8s-agent] cab-aggregation: increase memory limit'],
  ['#e11d48','📈','Anomaly: P99 latency 5.2s detected on channel-manager (threshold 1s)'],
  ['#58a6ff','🧠','RCA L0 check → L1 pattern match: KafkaProducer init race (0.08s)'],
  ['#58a6ff','⚡','L1 cache hit — skipping LLM call, result from Redis pattern store'],
  ['#0891b2','🔄','Rollout: otaconsumer 1/2 replicas ready — monitoring for 5 min'],
  ['#0891b2','⚠️', 'WARNING: rollout stuck → k8s_agent inspecting new pod'],
  ['#7c3aed','🔍','ImagePullBackOff — wrong image tag in manifest, suggesting fix'],
  ['#7c3aed','✅','PR: [k8s-agent] otaconsumer: correct image tag :latest → :2.4.1'],
  ['#8b5cf6','🚫','Pod travelport: CreateContainerConfigError — secret not found'],
  ['#0891b2','🔍','InfraFix: scanning manifest — VaultSecretMissing detected'],
  ['#0891b2','✅','PR: [InfraFix] travelport: add missing db-credentials secret ref'],
  ['#e3b341','⚙️', 'Jenkins AI-AGENT-BOT: build triggered on merged PR'],
  ['#0369a1','🚀','ArgoCD: synced jupiter/venus — all pods Running'],
  ['#dc2626','💾','Redis L0/L1 pattern updated with new resolution result'],
  ['#bc8cff','📊','Slack: InfraFix infra report — 2 issues auto-resolved this cycle'],
];

let evIdx=0;
function addLog(entry){
  const list=document.getElementById('log-list');
  const d=new Date();
  const ts=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  const e=document.createElement('div');e.className='le';
  e.innerHTML=`<span class="lt">${ts}</span><span class="lc">${entry[1]}</span><span class="lm">${entry[2]}</span>`;
  list.insertBefore(e,list.firstChild);
  while(list.children.length>80)list.removeChild(list.lastChild);
}

// ── PIPELINE STATUS ROWS ──
const PIPELINES=[
  {id:'codexa',  name:'CodeXA Auto-Fix',  color:'#3fb950', steps:['Detecting exceptions','Cloning repo','LLM analysis','Generating fix','Opening PR','Slack report','CI/CD deploy']},
  {id:'k8sagent',name:'k8s Agent Repair', color:'#bc8cff', steps:['Watching pods','Collecting logs','LLM diagnosis','YAML patch','Opening PR','Build+deploy']},
  {id:'rca',     name:'RCA Self-Learning',color:'#58a6ff', steps:['Metrics check','ES log pull','Cache lookup','LLM fallback','Pattern store']},
  {id:'rollout', name:'Rollout Monitor',  color:'#0891b2', steps:['Deploy watch','Stuck detect','Pod inspect','Image fix PR','ArgoCD sync']},
  {id:'infrafix',name:'InfraFix Audit',   color:'#f97316', steps:['K8s scan','Secret check','Manifest fix PR','Build+deploy','Slack notify']},
];
const pipeState={};

function buildPipelineRows(){
  const pipes=document.getElementById('pipes');
  for(const p of PIPELINES){
    const row=document.createElement('div');row.className='prow';row.id='pr_'+p.id;
    row.innerHTML=`<div class="pdot" style="background:${p.color}"></div>`+
      `<div class="pname" style="color:${p.color}">${p.name}</div>`+
      `<div class="pstep" id="ps_${p.id}" style="color:${p.color}">running</div>`;
    pipes.appendChild(row);
    pipeState[p.id]={stepIdx:0,timer:null};
  }
}

function cyclePipelineStep(p){
  const el=document.getElementById('ps_'+p.id);
  if(!el)return;
  const st=pipeState[p.id];
  el.textContent=`${st.stepIdx+1}/${p.steps.length}: ${p.steps[st.stepIdx]}`;
  st.stepIdx=(st.stepIdx+1)%p.steps.length;
}

// ── NODE PULSE (subtle glow when relevant) ──
const nodeIds=Object.keys(N);
function pulseRandomNode(){
  const id=nodeIds[Math.floor(Math.random()*nodeIds.length)];
  const g=document.getElementById('nd_'+id);
  if(!g)return;
  const bg=g.querySelector('.nb');
  const nc=N[id].c;
  bg.setAttribute('fill',nc+'18');
  bg.setAttribute('stroke',nc);
  bg.setAttribute('stroke-width','2');
  g.style.filter=`drop-shadow(0 0 8px ${nc}88)`;
  setTimeout(()=>{
    bg.setAttribute('fill','#060e1a');
    bg.setAttribute('stroke',nc+'44');
    bg.setAttribute('stroke-width','1.5');
    g.style.filter='';
  },900);
}

// ── STATS ──
const ST=[0,0,0];
function bump(i){ST[i]++;document.getElementById('s'+i).textContent=ST[i]}

// ── INIT ──
build();
buildPipelineRows();

// Inject the keyframe via a style tag (uses CSS variable trick)
const st=document.createElement('style');
st.textContent='@keyframes fl{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}';
document.head.appendChild(st);

// Continuously fire log events — one every 2.8s, cycling through all events
setInterval(()=>{
  addLog(EVENTS[evIdx%EVENTS.length]);
  // bump stats occasionally
  const ev=EVENTS[evIdx%EVENTS.length];
  if(ev[2].includes('PR opened'))bump(1);
  if(ev[2].includes('ArgoCD'))bump(2);
  if(ev[2].includes('detected')||ev[2].includes('Exception')||ev[2].includes('CrashLoop')||ev[2].includes('ConfigError'))bump(0);
  evIdx++;
},2800);

// Cycle pipeline step labels — each pipeline on its own interval
PIPELINES.forEach((p,i)=>{
  setInterval(()=>cyclePipelineStep(p), 3500+i*600);
});

// Node pulse — random node glows every 1.4s
setInterval(pulseRandomNode, 1400);
</script>
</body>
</html>
