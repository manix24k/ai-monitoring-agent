# Default values for ai-monitoring-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ai-monitoring-agent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: ai-monitoring-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  prometheus:
    url: "http://prometheus-server.venus.svc.cluster.local:9090"
    urls:
      - "http://prometheus-server.venus.svc.cluster.local:9090"
      - "http://prometheus-server.jupiter.svc.cluster.local:9090"
  elasticsearch:
    hosts:
      - "http://20.244.5.27:9200"
    indexPrefix: "logs-*"
    logLimit: 100
    traceLimit: 50
  llm:
    apiUrl: "http://20.244.11.93/v1"
    apiKey: ""
    model: "qwen3"
    timeout: 20
  slack:
    webhook_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
