apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-monitoring-agent-ingress
  namespace: ai-monitoring
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ai-monitoring-agent.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-monitoring-agent
            port:
              number: 80